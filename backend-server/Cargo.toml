[package]
name = "pema-backend-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = { workspace = true }
actix-cors = { workspace = true }
actix-rt = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Database
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "migrate"] }

# Async runtime
tokio = { workspace = true }

# Date/Time
chrono = { workspace = true }
uuid = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# WASM runtime for plugins
wasmtime = "25.0"

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-actix-web = { workspace = true }

# Configuration
dotenv = { workspace = true }
config = { workspace = true }

# Authentication
jsonwebtoken = { workspace = true }
argon2 = { workspace = true }

# Validation
validator = { workspace = true }

# Additional
futures = { workspace = true }
futures-util = "0.3"
async-trait = "0.1"
actix-web-httpauth = "0.8"
hmac = "0.12"
sha2 = "0.10"
log = "0.4"

# Shared crates
shared-config = { path = "../shared/config" }
models = { path = "../shared/models", features = ["sqlx"] }
dtos = { path = "../shared/dtos" }
plugin-sdk = { path = "../shared/plugin-sdk" }

[dev-dependencies]
actix-web = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid = { workspace = true }
chrono = { workspace = true }

[package.metadata.sqlx]
offline = false
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"

