[package]
name = "pema-backend-server"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json", "migrate"] }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }

log = "0.4"
env_logger = "0.10"
dotenvy = "0.15"
jwt = "0.16"
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
actix-web-httpauth = "0.8"
futures-util = "0.3"
async-trait = "0.1"


# Shared crates
shared-config = { path = "../shared/config" }
models = { path = "../shared/models", features = ["sqlx"] }

[dev-dependencies]
actix-web = { workspace = true }
sqlx = { workspace = true, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "json"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
uuid = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"

