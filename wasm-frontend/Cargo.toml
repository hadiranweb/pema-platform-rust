[package]
name = "wasm-frontend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", 
  "Document", 
  "Element", 
  "HtmlElement", 
  "HtmlSelectElement", 
  "HtmlInputElement",
  "Event",
  "Request",
  "RequestInit",
  "RequestMode",
  "Response",
  "Headers",
  "Storage",
  "console",
  "EventTarget",
  "InputEvent",
  "MouseEvent",
  "SubmitEvent",
] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
urlencoding = "2.1"
base64 = "0.21"
models = { path = "../shared/models" }
uuid = { version = "1", features = ["serde", "v4", "js"] }
chrono = { version = "0.4", features = ["serde"] }
serde-wasm-bindgen = "0.6"

[features]
default = ["wasm"]
wasm = ["wasm-bindgen"]

[dev-dependencies]
wasm-bindgen-test = "0.3"


