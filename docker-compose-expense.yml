version: '3.8'

services:
  backend:
    build:
      context: ./expense-backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=debug
    networks:
      - expense-network

  frontend:
    build:
      context: ./expense-frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:3000
    networks:
      - expense-network

networks:
  expense-network:
    driver: bridge

