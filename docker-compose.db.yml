version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: pema_postgres
    environment:
      POSTGRES_DB: pema_db
      POSTGRES_USER: pema_user
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pema_user -d pema_db"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
