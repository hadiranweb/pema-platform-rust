[workspace]
resolver = "2"
members = [
    # Frontend Applications
    "frontend",
    "wasm-frontend",
    
    # Backend Services
    "backend",
    "backend-server",
    "auth-server",
    "wasm-auth-backend",
    "wasm-general-backend",
    
    # Shared Libraries
    "shared/models",
    "shared/config",
    "shared/dtos",
    "shared/plugin-sdk",
    
    # Plugins
    "plugins/discount_calculator",
    
    # Utilities
    "ahash_fork",
    "tempfile_fork",
]

[workspace.dependencies]
# Web Framework - Yew
yew = "0.21"
yew-router = "0.18"

# Web Framework - Actix
actix-web = "4.4"
actix-cors = "0.7"
actix-web-httpauth = "0.8"

# Web Framework - Axum
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Async Runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebAssembly
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
js-sys = "0.3"

# HTTP Client
gloo-net = "0.4"
reqwest = { version = "0.11", features = ["json"] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"

# Crypto & Security
jsonwebtoken = "9.0"
bcrypt = "0.15"
argon2 = "0.5"
secrecy = "0.8"
rand = "0.8"

# Validation
validator = { version = "0.16", features = ["derive"] }

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
env_logger = "0.10"

# Utilities
derive_more = "0.99"

