[package]
name = "wasm-auth-backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = { version = "0.2", features = ["serde-serialize"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"], default-features = false }
uuid = { version = "1", features = ["serde", "v4", "js"], default-features = false }
models = { path = "../shared/models" }
shared-config = { path = "../shared/config" }
jwt = "0.16"
hmac = "0.12"
sha2 = "0.10"

[features]
default = ["wasm"]
wasm = ["wasm-bindgen"]

